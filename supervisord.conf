[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:fix-permissions]
command=/bin/sh -c "chown -R sub2api:sub2api /app/data && echo 'Permissions fixed'"
autostart=true
autorestart=false
startsecs=0
priority=1

[program:sub2api]
command=/app/sub2api
directory=/app
user=sub2api
autostart=true
autorestart=true
priority=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopasgroup=true
stopsignal=TERM
stopwaitsecs=30

[program:sub2report]
command=python3 -m uvicorn app:app --host 0.0.0.0 --port 5000
directory=/app/sub2report
user=sub2api
autostart=true
autorestart=true
priority=200
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopasgroup=true
stopsignal=TERM
stopwaitsecs=10
