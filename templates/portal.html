<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>门户 · sub2report</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f5f7fa;color:#333;min-height:100vh}
  .header{background:#fff;border-bottom:1px solid #e4e7ed;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between}
  .header h1{font-size:18px;font-weight:600;color:#1a1a1a}
  .header .right{font-size:13px;color:#606266;display:flex;align-items:center;gap:14px}
  .header a{color:#409eff;text-decoration:none}
  .container{max-width:1200px;margin:0 auto;padding:24px}
  .group{margin-bottom:26px}
  .group h2{font-size:14px;color:#909399;font-weight:600;margin-bottom:12px;letter-spacing:.5px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
  .tile{display:block;background:#fff;border:1px solid #ebeef5;border-radius:10px;padding:18px 18px;text-decoration:none;color:#1a1a1a;box-shadow:0 1px 4px rgba(0,0,0,.05);transition:all .15s}
  .tile:hover{border-color:#409eff;box-shadow:0 4px 16px rgba(64,158,255,.15);transform:translateY(-1px)}
  .tile .t{font-size:15px;font-weight:600}
  .tile .p{font-size:12px;color:#909399;margin-top:6px}
  .empty{color:#c0c4cc;font-size:14px}
</style>
</head>
<body>
  <div class="header">
    <h1>sub2report 运营平台</h1>
    <div class="right">
      <span>{{ user.display_name or user.email }}</span>
      <a href="/change-password">改密</a>
      <a href="/logout">退出</a>
    </div>
  </div>
  <div class="container">
    {% if not grouped %}<div class="empty">你的角色暂无任何可访问的菜单，请联系管理员分配权限。</div>{% endif %}
    {% for grp, items in grouped %}
    <div class="group">
      <h2>{{ grp }}</h2>
      <div class="grid">
        {% for m in items %}
        <a class="tile" href="{{ m.path }}"><div class="t">{{ m.title }}</div><div class="p">{{ m.path }}</div></a>
        {% endfor %}
      </div>
    </div>
    {% endfor %}
  </div>
</body>
</html>
