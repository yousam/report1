<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>修改密码 · sub2report</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f5f7fa;min-height:100vh;display:flex;align-items:center;justify-content:center}
  .box{background:#fff;border-radius:10px;box-shadow:0 4px 24px rgba(0,0,0,.08);padding:32px 30px;width:360px}
  h1{font-size:18px;color:#1a1a1a;margin-bottom:20px}
  label{display:block;font-size:13px;color:#606266;margin:14px 0 6px}
  input{width:100%;height:40px;padding:0 12px;border:1px solid #dcdfe6;border-radius:6px;font-size:14px;outline:none}
  input:focus{border-color:#409eff}
  button{width:100%;height:42px;margin-top:22px;border:none;border-radius:6px;background:#409eff;color:#fff;font-size:15px;cursor:pointer}
  .err{color:#f56c6c;font-size:13px;margin-top:12px;min-height:18px}
  .ok{color:#1f9550;font-size:13px;margin-top:12px}
  a{color:#409eff;font-size:13px;text-decoration:none}
</style>
</head>
<body>
  <form class="box" method="post" action="/change-password">
    <h1>修改密码</h1>
    <label>原密码</label>
    <input type="password" name="old_password" required>
    <label>新密码（至少 6 位）</label>
    <input type="password" name="new_password" required>
    <button type="submit">提交</button>
    {% if ok %}<div class="ok">已修改成功。<a href="/portal">进入门户</a></div>{% endif %}
    <div class="err">{{ error }}</div>
    <div style="margin-top:14px"><a href="/portal">返回门户</a> · <a href="/logout">退出登录</a></div>
  </form>
</body>
</html>
