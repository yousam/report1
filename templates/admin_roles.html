<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>角色管理 · sub2report</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f5f7fa;color:#333}
  .header{background:#fff;border-bottom:1px solid #e4e7ed;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between}
  .header h1{font-size:18px;font-weight:600}.header a{color:#409eff;text-decoration:none;font-size:13px}
  .container{max-width:1100px;margin:0 auto;padding:20px}
  .card{background:#fff;border-radius:8px;padding:16px 20px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{background:#fafafa;color:#606266;text-align:left;padding:8px 10px;border-bottom:2px solid #ebeef5}
  td{padding:8px 10px;border-bottom:1px solid #f0f2f5}
  .btn{height:32px;padding:0 14px;border:none;border-radius:6px;font-size:13px;cursor:pointer;background:#409eff;color:#fff}
  .btn-ghost{background:#fff;color:#606266;border:1px solid #dcdfe6}
  .btn-del{background:#fff;color:#f56c6c;border:1px solid #fbc4c4;height:28px;padding:0 10px;border-radius:6px;cursor:pointer;font-size:12px}
  .btn-sm{height:28px;padding:0 10px;border-radius:6px;font-size:12px;cursor:pointer;background:#fff;color:#409eff;border:1px solid #b3d8ff}
  .fi{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
  .fi label{font-size:12px;color:#606266}
  .fi input{height:34px;padding:0 10px;border:1px solid #dcdfe6;border-radius:6px;font-size:13px;outline:none}
  .perms{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px;font-size:13px;border:1px solid #ebeef5;border-radius:6px;padding:10px;max-height:300px;overflow:auto}
  .panel{display:none}.panel.show{display:block}
  .meta{color:#909399;font-size:12px;margin-left:10px}
  .sys{color:#e6a23c;font-size:11px}
</style>
</head>
<body>
  <div class="header"><h1>角色管理</h1><div><a href="/portal">← 门户</a> &nbsp; <a href="/logout">退出</a></div></div>
  <div class="container">
    <div class="card">
      <button class="btn" id="addBtn">+ 新增角色</button>
      <div class="panel" id="panel" style="margin-top:14px;border-top:1px solid #f0f2f5;padding-top:14px">
        <input type="hidden" id="f-id">
        <div class="fi"><label>角色名</label><input type="text" id="f-name" style="width:240px"></div>
        <div class="fi"><label>描述</label><input type="text" id="f-desc" style="width:380px"></div>
        <div class="fi"><label>权限（勾选可访问的页面/功能）</label><div class="perms" id="f-perms"></div></div>
        <button class="btn" id="saveBtn">保存</button>
        <button class="btn-ghost" id="cancelBtn">取消</button>
        <span class="meta" id="formMsg"></span>
      </div>
    </div>
    <div class="card">
      <table><thead><tr><th>ID</th><th>角色</th><th>描述</th><th>权限数</th><th>操作</th></tr></thead><tbody id="body"></tbody></table>
    </div>
  </div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let PERMS=[];
async function load(){
  const d=await(await fetch("/api/admin/roles")).json();
  PERMS=d.permissions||[];
  const b=$("body");b.innerHTML="";
  (d.roles||[]).forEach(r=>{
    const tr=document.createElement("tr");
    const sys=r.is_system?' <span class="sys">[系统]</span>':'';
    tr.innerHTML='<td>'+r.id+'</td><td>'+esc(r.name)+sys+'</td><td>'+esc(r.description||"")+'</td><td>'+(r.perms||[]).length+'</td>'+
      '<td><button class="btn-sm" onclick=\'edit('+JSON.stringify(r).replace(/'/g,"&#39;")+')\'>编辑</button> '+
      (r.is_system?'':'<button class="btn-del" onclick="del('+r.id+",'"+esc(r.name)+"'"+')">删除</button>')+'</td>';
    b.appendChild(tr);
  });
}
function permBoxes(checked){
  return PERMS.map(p=>'<label><input type="checkbox" value="'+p.code+'"'+((checked||[]).includes(p.code)?' checked':'')+'> '+esc(p.name)+' <span style="color:#c0c4cc">'+esc(p.code)+'</span></label>').join("");
}
$("addBtn").onclick=()=>{$("f-id").value="";$("f-name").value="";$("f-name").disabled=false;$("f-desc").value="";$("f-perms").innerHTML=permBoxes([]);$("panel").classList.add("show");$("formMsg").textContent="";};
window.edit=(r)=>{$("f-id").value=r.id;$("f-name").value=r.name;$("f-name").disabled=!!r.is_system;$("f-desc").value=r.description||"";$("f-perms").innerHTML=permBoxes(r.perms||[]);$("panel").classList.add("show");$("formMsg").textContent="";};
$("cancelBtn").onclick=()=>$("panel").classList.remove("show");
$("saveBtn").onclick=async()=>{
  const id=$("f-id").value;
  const perms=[...$("f-perms").querySelectorAll("input:checked")].map(x=>x.value);
  let resp;
  if(id)resp=await fetch("/api/admin/roles/"+id,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:$("f-name").value.trim(),description:$("f-desc").value,perms})});
  else resp=await fetch("/api/admin/roles",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:$("f-name").value.trim(),description:$("f-desc").value,perms})});
  const d=await resp.json();
  if(d.ok){$("panel").classList.remove("show");load();}else $("formMsg").textContent=d.error||"保存失败";
};
window.del=async(id,name)=>{if(!confirm("删除角色 "+name+" ?"))return;const d=await(await fetch("/api/admin/roles/"+id,{method:"DELETE"})).json();if(d.ok)load();else alert(d.error||"删除失败");};
load();
</script>
</body>
</html>
