<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · sub2report</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f5f7fa;min-height:100vh;display:flex;align-items:center;justify-content:center}
  .box{background:#fff;border-radius:10px;box-shadow:0 4px 24px rgba(0,0,0,.08);padding:32px 30px;width:360px}
  h1{font-size:20px;color:#1a1a1a;margin-bottom:4px}
  .sub{font-size:13px;color:#909399;margin-bottom:22px}
  label{display:block;font-size:13px;color:#606266;margin:14px 0 6px}
  input{width:100%;height:40px;padding:0 12px;border:1px solid #dcdfe6;border-radius:6px;font-size:14px;outline:none}
  input:focus{border-color:#409eff}
  button{width:100%;height:42px;margin-top:22px;border:none;border-radius:6px;background:#409eff;color:#fff;font-size:15px;font-weight:500;cursor:pointer}
  button:hover{background:#337ecc}
  .err{color:#f56c6c;font-size:13px;margin-top:12px;min-height:18px}
</style>
</head>
<body>
  <form class="box" method="post" action="/login">
    <h1>sub2report</h1>
    <div class="sub">聚合运营平台 · 请登录</div>
    <label>邮箱</label>
    <input type="email" name="email" autocomplete="username" autofocus required>
    <label>密码</label>
    <input type="password" name="password" autocomplete="current-password" required>
    <button type="submit">登录</button>
    <div class="err">{{ error }}</div>
  </form>
</body>
</html>
