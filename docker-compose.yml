# sub2report — 多站点 sub2api 运营平台（带登录/RBAC + 本地 Postgres）
#
# 快速启动：
#   cp .env.example .env && 改一个强密码 S2R_DB_PASSWORD
#   docker compose up -d --build
#   打开 http://<host>:5000/  → 登录（默认 nanxb@qq.com / Asd123456）→ 门户
#   首次登录后请尽快在「人员管理」改密。
#
# 站点凭证、告警配置、人员/角色/权限/菜单/审计都存本地 Postgres(sub2report-db)。
# 站点配置首次启动会自动从 ./sub2report_data/sites.json（若存在）导入。

services:
  sub2report-db:
    image: postgres:16-alpine
    container_name: sub2report-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: s2r
      POSTGRES_PASSWORD: ${S2R_DB_PASSWORD:?set S2R_DB_PASSWORD in .env}
      POSTGRES_DB: sub2report
      TZ: Asia/Shanghai
    volumes:
      - ./sub2report_db_data:/var/lib/postgresql/data

  sub2report:
    build:
      context: .
      dockerfile: Dockerfile
    image: sub2report:latest
    container_name: sub2report
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      SITES_FILE: /data/sites.json
      ALERTS_FILE: /data/alerts.json
      S2R_DATABASE_URL: postgresql://s2r:${S2R_DB_PASSWORD}@sub2report-db:5432/sub2report
      TZ: Asia/Shanghai
    volumes:
      - ./sub2report_data:/data
    depends_on:
      - sub2report-db
